name: Dream released APK startup test

on:
  workflow_dispatch:
    inputs:
      release:
        description: Existing diagnostic release tag
        required: true
        default: dream-41766425794-1
      observe_fixture:
        description: Test-only synthetic observability metadata; never a deliverable APK
        type: boolean
        default: false
      build_run:
        description: Optional build run containing dream-candidate-apk; overrides release
        default: ""
      failed_fixture:
        description: Include a synthetic failed session in the disposable server
        type: boolean
        default: false
      app_package:
        description: Package of the existing APK under test
        type: choice
        default: com.t3tools.t3code.dream
        options:
          - com.t3tools.t3code.dream
          - com.t3tools.t3code

permissions:
  contents: read
  actions: read

jobs:
  startup:
    if: github.repository == 'EliBlauBalto/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      - run: vp i --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download the existing release without rebuilding
        if: inputs.build_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release download "$RELEASE" --pattern T3-Code-Dream.apk --dir /tmp/dream-apk
      - name: Download an existing candidate without rebuilding
        if: inputs.build_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          gh run download "$BUILD_RUN" --name dream-candidate-apk --dir /tmp/dream-apk
          mv /tmp/dream-apk/app-release.apk /tmp/dream-apk/T3-Code-Dream.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native release startup test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          T3_STARTUP_OBSERVE_FIXTURE: ${{ inputs.observe_fixture && '1' || '0' }}
          T3_DREAM_FAILED_FIXTURE: ${{ inputs.failed_fixture && '1' || '0' }}
          T3_DREAM_APP_ID: ${{ inputs.app_package }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: node scripts/dream-startup-fixture.ts /tmp/dream-apk/T3-Code-Dream.apk /tmp/dream-startup-evidence
      - name: Retain startup result and native crash logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dream-startup-evidence
          path: |
            /tmp/dream-startup-evidence/*.txt
            /tmp/dream-startup-evidence/*.json
            /tmp/dream-startup-evidence/capture/
          if-no-files-found: warn
