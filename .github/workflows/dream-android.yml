name: Personal Android Dream APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'EliBlauBalto/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VARIANT: dream
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - run: vp i --frozen-lockfile
      - run: vp run check:changed HEAD^
      - name: Generate Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --no-install
      - name: Limit intermediate native debug output on the standard runner
        working-directory: apps/mobile/android
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android.defaultConfig.externalNativeBuild.cmake.arguments "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG", "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG"
          GRADLE
      - name: Build standalone ARM64 APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew :t3-native-controls:compileReleaseKotlin -PreactNativeArchitectures=arm64-v8a --max-workers=2 --build-cache
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2 --build-cache
      - name: Retain candidate APK for installed startup verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dream-candidate-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Retain release JavaScript source maps for startup diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dream-startup-source-maps
          path: |
            apps/mobile/android/app/build/generated/sourcemaps/react/release/
            apps/mobile/android/app/build/intermediates/sourcemaps/react/release/
          if-no-files-found: error
      - name: Verify APK identity and native screen saver registration
        run: |
          python3 - <<'PY'
          import os, subprocess, xml.etree.ElementTree as ET
          analyzer = os.path.join(os.environ["ANDROID_HOME"], "cmdline-tools/latest/bin/apkanalyzer")
          apk = "apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          root = ET.fromstring(subprocess.check_output([analyzer, "manifest", "print", apk], text=True))
          android = "{http://schemas.android.com/apk/res/android}"
          assert root.get("package") == "com.t3tools.t3code.dream"
          service = next(item for item in root.findall("application/service") if item.get(android + "name") == "expo.modules.t3nativecontrols.T3DreamService")
          assert service.get(android + "permission") == "android.permission.BIND_DREAM_SERVICE"
          assert service.get(android + "exported") == "true"
          assert any(item.get(android + "name") == "android.service.dreams.DreamService" for item in service.findall("intent-filter/action"))
          assert any(item.get(android + "name") == "android.service.dream" for item in service.findall("meta-data"))
          print("APK package and DreamService registration verified")
          PY

  startup:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      - run: vp i --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dream-candidate-apk
          path: /tmp/dream-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed release startup and native Dream
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: node scripts/dream-startup-fixture.ts /tmp/dream-apk/app-release.apk /tmp/dream-startup-evidence
      - name: Retain installed verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dream-installed-verification
          path: |
            /tmp/dream-startup-evidence/*.txt
            /tmp/dream-startup-evidence/capture/
          if-no-files-found: warn
